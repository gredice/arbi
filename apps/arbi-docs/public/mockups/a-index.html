<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARBI · A · Index</title>
<link rel="icon" type="image/png" href="data/docs/assets/brand/arbi-mark-transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
@theme {
  --color-paper: #e8e7e3;
  --color-tile: #f3f2ef;
  --color-well: #dcdbd6;
  --color-ink: #121212;
  --color-mute: #7d7c78;
  --color-rule: #c9c7c1;
  --font-sans: "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
@layer base {
  html { -webkit-font-smoothing: antialiased; }
  body { @apply bg-paper text-ink font-sans text-[13px] leading-[1.45]; }
  a { @apply transition-opacity hover:opacity-60; }
}
@utility label { @apply font-mono text-[10.5px] uppercase tracking-[0.08em] text-mute; }
@utility num { @apply font-mono tabular-nums; }
@utility tile { @apply bg-tile rounded-[14px]; }
@utility chip { @apply inline-flex items-center gap-1.5 rounded-full border border-rule px-2.5 py-0.5 font-mono text-[10.5px] uppercase tracking-[0.06em]; }
@utility btn { @apply inline-flex items-center justify-between gap-6 rounded-full bg-ink px-4 py-2 text-[12px] text-tile hover:opacity-80; }
@utility btn-ghost { @apply inline-flex items-center justify-between gap-6 rounded-full border border-ink px-4 py-2 text-[12px] hover:bg-ink hover:text-tile hover:opacity-100; }
.prose-doc { @apply max-w-[68ch] text-[14px] leading-[1.65]; }
.prose-doc h1 { @apply text-[40px] font-light tracking-tight leading-none mb-8; }
.prose-doc h2 { @apply mt-12 mb-3 text-[11px] font-mono uppercase tracking-[0.08em] text-mute border-t border-rule pt-3; }
.prose-doc h3 { @apply mt-8 mb-2 font-medium; }
.prose-doc p, .prose-doc ul, .prose-doc ol { @apply mb-4; }
.prose-doc ul { @apply list-disc pl-5; } .prose-doc ol { @apply list-decimal pl-5; }
.prose-doc a { @apply underline decoration-rule underline-offset-2; }
.prose-doc table { @apply w-full my-6 text-[12px]; } .prose-doc th { @apply label text-left border-b border-ink py-1.5 pr-3; }
.prose-doc td { @apply border-b border-rule py-1.5 pr-3 align-top; }
.prose-doc code { @apply font-mono text-[12px] bg-well/60 px-1 rounded; }
.prose-doc pre { @apply bg-tile rounded-xl p-4 my-4 overflow-x-auto font-mono text-[12px]; }
.prose-doc img { @apply rounded-xl my-6 bg-tile; }
.callout { position:absolute; transform:translate(-50%,-50%); display:grid; place-items:center; width:22px; height:22px; border-radius:999px; background:var(--color-ink); color:var(--color-tile); font:500 10px var(--font-mono); pointer-events:auto; cursor:pointer; user-select:none; transition: transform .15s; }
.callout:hover, .callout.on { background:var(--color-tile); color:var(--color-ink); box-shadow:0 0 0 1px var(--color-ink); transform:translate(-50%,-50%) scale(1.25); }
</style>
</head>
<body>
<header class="sticky top-0 z-30 bg-paper/85 backdrop-blur border-b border-rule">
  <div class="mx-auto max-w-[1480px] px-4 sm:px-6 h-12 flex items-center gap-8">
    <a href="#/" class="shrink-0"><img src="data/docs/assets/brand/arbi-logo-transparent.png" alt="ARBI" class="h-8 w-auto"></a>
    <nav class="flex gap-5 text-[12.5px] overflow-x-auto" id="nav">
      <a href="#/systems">systems</a><a href="#/parts">parts</a><a href="#/bom">bom</a><a href="#/docs">docs</a><a href="#/downloads">downloads</a>
    </nav>
    <div class="ml-auto hidden md:flex items-center gap-3 label" id="commit"></div>
  </div>
</header>
<main id="app" class="mx-auto max-w-[1480px] px-4 sm:px-6 pb-24"></main>
<footer class="border-t border-rule">
  <div class="mx-auto max-w-[1480px] px-4 sm:px-6 py-8 grid grid-cols-2 md:grid-cols-4 gap-6 label">
    <div>arbi · automatic raised bed imaging</div>
    <div>agpl-3.0-only</div>
    <div>all content compiled from git</div>
    <div class="md:text-right">mockup a · index</div>
  </div>
</footer>
<div id="tip" class="fixed z-50 pointer-events-none hidden rounded-lg bg-ink text-tile px-2.5 py-1.5 text-[11px]"></div>

<script type="module">
import { loadSite, Viewer, router, renderDoc, fmt, links, DATA, layoutCallouts } from './shared/arbi.js';

const S = await loadSite();
const $app = document.getElementById('app');
const tip = document.getElementById('tip');
let viewers = [];
document.getElementById('commit').innerHTML = `<span class="size-1.5 rounded-full bg-ink inline-block"></span> main @ <a href="${links.commit(S.site.commit)}" target="_blank">${S.site.commit.slice(0, 7)}</a> · ${S.site.commitDate}`;

const img = (path, cls = '') => `<img src="${DATA + path}" class="${cls}" loading="lazy" alt="">`;
const statusChip = (s) => `<span class="chip"><span class="size-1.5 rounded-full ${s === 'concept-unvalidated' ? 'border border-ink' : 'bg-ink'}"></span>${fmt.status(s)}</span>`;
const rows = (pairs) => pairs.map(([k, v]) => `<div class="grid grid-cols-[120px_1fr] gap-4 py-2 border-b border-rule"><div class="label pt-0.5">${k}</div><div>${v ?? '—'}</div></div>`).join('');
const sceneModels = (key) => [...new Map(S.scenes[key].parts.filter((p) => p.registered).map((p) => [p.model, p])).keys()];

function mountViewer(el, opts) { const v = new Viewer(el, opts); viewers.push(v); return v; }

function callouts(viewer, layer, models, onPick) {
  const index = Object.fromEntries(models.map((m, i) => [m, i + 1]));
  layer.innerHTML = `<svg class="absolute inset-0 w-full h-full">${models.map((m) => `<g data-l="${m}"><line stroke="#121212" stroke-width="0.75"/><circle r="2.5" fill="#121212"/></g>`).join('')}</svg>` +
    models.map((m) => `<div class="callout" data-m="${m}">${fmt.pad(index[m])}</div>`).join('');
  const els = Object.fromEntries(models.map((m) => [m, { g: layer.querySelector(`[data-l="${m}"]`), d: layer.querySelector(`[data-m="${m}"]`) }]));
  viewer.on('frame', () => {
    const placed = layoutCallouts(viewer.anchors().filter((x) => index[x.part.model]), layer.clientWidth);
    const active = viewer.hovered?.part.model ?? viewer.focus;
    for (const x of placed) {
      const { g, d } = els[x.part.model];
      const on = !active || active === x.part.model;
      const [line, dot] = g.children;
      line.setAttribute('x1', x.x); line.setAttribute('y1', x.y); line.setAttribute('x2', x.lx); line.setAttribute('y2', x.ly);
      dot.setAttribute('cx', x.x); dot.setAttribute('cy', x.y);
      g.setAttribute('opacity', on ? 1 : 0.2);
      d.style.left = x.lx + 'px'; d.style.top = x.ly + 'px'; d.style.opacity = on ? 1 : 0.35;
      d.classList.toggle('on', active === x.part.model);
    }
  });
  layer.addEventListener('click', (e) => { const m = e.target.closest('[data-m]')?.dataset.m; if (m) onPick(m); });
  layer.addEventListener('mouseover', (e) => { viewer.setFocus(e.target.closest('[data-m]')?.dataset.m ?? null); });
  layer.addEventListener('mouseout', () => viewer.setFocus(null));
}

function hoverTip(viewer) {
  viewer.on('hover', (p) => {
    tip.classList.toggle('hidden', !p);
    if (p) tip.innerHTML = `${p.registered ? p.model : `${p.model.replace(/-reference|-UNVERIFIED/, '')} <span class="opacity-50">· reference</span>`}`;
  }).on('move', () => {});
  viewer.renderer.domElement.addEventListener('pointermove', (e) => { tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px'; });
}

// ------------------------------------------------------------------ views

const views = {
  async ''() {
    const pod = S.systemBySlug['camera-pod'];
    const sum = S.site.bom.summary;
    const counts = [
      [S.models.length, 'registered cad models'],
      [S.models.filter((m) => m.artifactRole === 'fabrication').length, 'printable parts'],
      [S.site.bom.parts.length, 'bom items'],
      [S.site.docs.length, 'engineering documents'],
    ];
    $app.innerHTML = `
      <section class="pt-6 grid lg:grid-cols-12 gap-3">
        <div class="tile lg:col-span-8 relative h-[64vh] min-h-[440px] overflow-hidden" id="hero">
          <div class="absolute left-5 top-4 label z-10">fig. 01 — camera pod, integrated rain enclosure · live cad</div>
          <div class="absolute right-5 top-4 z-10 flex gap-1" id="mode">
            <button data-x="0" class="chip bg-ink text-tile border-ink">assembled</button><button data-x="1" class="chip">exploded</button>
          </div>
          <div class="absolute left-5 bottom-4 z-10 label">drag to orbit · click a part</div>
        </div>
        <div class="lg:col-span-4 flex flex-col gap-3">
          <div class="tile p-6 flex-1 flex flex-col">
            <div class="label">open hardware · ${S.site.commitDate}</div>
            <h1 class="mt-auto text-[64px] leading-[0.9] font-light tracking-[-0.04em]">ARBI</h1>
            <p class="mt-3 text-[15px] leading-snug max-w-[34ch]">A four-cable outdoor camera robot for repeatable images of raised beds.</p>
            <div class="mt-6 flex flex-wrap gap-2"><a class="btn" href="#/systems/camera-pod">explore the pod <span>→</span></a><a class="btn-ghost" href="#/downloads">downloads <span>↓</span></a></div>
          </div>
          <div class="grid grid-cols-2 gap-3">${counts.map(([n, l]) => `<div class="tile p-4"><div class="num text-[28px] leading-none">${n}</div><div class="label mt-2">${l}</div></div>`).join('')}</div>
        </div>
      </section>
      <section class="mt-16">
        <div class="flex items-baseline justify-between border-b border-ink pb-2"><h2 class="label text-ink">systems</h2><a href="#/systems" class="label">all ${S.systems.length} →</a></div>
        <div class="mt-3 grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-3">${S.systems.map(systemTile).join('')}</div>
      </section>
      <section class="mt-16 grid lg:grid-cols-12 gap-3">
        <figure class="lg:col-span-8 tile overflow-hidden">${img('docs/assets/arbi-cover.png', 'w-full aspect-[2.5/1] object-cover')}
          <figcaption class="label p-4">concept imagery · not a built installation · docs/assets/arbi-cover.png</figcaption></figure>
        <div class="lg:col-span-4 tile p-6 flex flex-col">
          <div class="label">bom · ${sum.destinationName}</div>
          <div class="mt-auto"><div class="num text-[44px] leading-none">${fmt.eur(sum.knownSubtotal)}</div>
          <div class="label mt-2">known partial subtotal · complete total ${sum.complete ? fmt.eur(sum.completeLandedTotal) : 'unavailable'}</div>
          ${goodsBar()}
          <a href="#/bom" class="btn mt-6 w-full">open bill of materials <span>→</span></a></div>
        </div>
      </section>`;
    const v = mountViewer(document.getElementById('hero'), { style: 'light', autoRotate: true });
    await v.loadScene('pod', S.scenes.pod);
    v.frame({ distance: 0.62 });
    hoverTip(v);
    v.on('pick', (p) => p.registered && (location.hash = `#/parts/${p.model}`));
    document.getElementById('mode').onclick = (e) => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      v.setExplode(+b.dataset.x);
      document.querySelectorAll('#mode button').forEach((x) => x.classList.toggle('bg-ink', x === b) || x.classList.toggle('text-tile', x === b));
      document.querySelectorAll('#mode button').forEach((x) => { x.classList.toggle('text-tile', x === b); x.classList.toggle('border-ink', x === b); });
    };
  },

  async systems([slug]) {
    if (!slug) {
      $app.innerHTML = `<h1 class="pt-10 pb-6 text-[48px] font-light tracking-tight">Systems</h1>
        <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3">${S.systems.map((s) => systemTile(s, true)).join('')}</div>`;
      return;
    }
    const sys = S.systemBySlug[slug];
    const sceneKey = sys.scene;
    const ids = sceneKey ? sceneModels(sceneKey) : [];
    const others = sys.models.filter((m) => !ids.includes(m.id));
    $app.innerHTML = `
      <div class="pt-6 flex flex-wrap items-end gap-x-10 gap-y-2 pb-4">
        <div><div class="label"><a href="#/systems">systems</a> / ${fmt.pad(S.systems.indexOf(sys) + 1)}</div><h1 class="text-[48px] font-light tracking-tight leading-none mt-2">${sys.name}</h1></div>
        <p class="max-w-[60ch] text-mute pb-1">${sys.description}</p>
      </div>
      <section class="grid lg:grid-cols-12 gap-3">
        <div class="tile lg:col-span-8 relative h-[72vh] min-h-[480px] overflow-hidden" id="stage">
          ${sceneKey ? `<div id="calls" class="absolute inset-0 pointer-events-none z-10"></div>
          <div class="absolute left-5 top-4 z-20 label">${S.site.scenes[sceneKey].layout === 'lineup' ? 'parts layout · release meshes · no assembly pose registered' : sceneKey === 'camera-pod' ? `payload rain enclosure · pose ${S.site.scenes[sceneKey].pose ?? 'none'}` : `passive winch + full cover · pose ${S.site.scenes[sceneKey].pose ?? 'none'}`}</div>
          <div class="absolute left-1/2 -translate-x-1/2 bottom-4 z-20 flex items-center gap-3 bg-tile/90 rounded-full px-4 py-2">
            <span class="label">assembled</span><input id="ex" type="range" min="0" max="1" step="0.01" value="1" class="w-40 accent-ink"><span class="label">exploded</span></div>`
            : `<div class="absolute inset-0 grid place-items-center text-center p-10"><div><div class="label">no compiled scene yet</div><p class="mt-2 max-w-[40ch] text-mute">This system has ${sys.models.length} registered model(s) but no booklet pipeline exports meshes for it. The site shows renders as soon as CI produces them.</p></div></div>`}
        </div>
        <aside class="lg:col-span-4 tile p-5 overflow-auto lg:h-[72vh]">
          <div class="flex justify-between label border-b border-ink pb-2"><span>index</span><span>${ids.length} parts in view</span></div>
          <ol id="index">${ids.map((id, i) => indexRow(id, i + 1)).join('')}</ol>
          ${others.length ? `<div class="label mt-6 border-b border-ink pb-2">also registered</div><ol>${others.map((m) => indexRow(m.id, null)).join('')}</ol>` : ''}
          <div class="label mt-6 border-b border-ink pb-2">documents</div>
          <a class="flex justify-between py-2 border-b border-rule" href="#/docs/${sys.documentation}"><span>${sys.doc?.title ?? sys.documentation}</span><span>→</span></a>
        </aside>
      </section>
      ${sys.exploded ? `<section class="mt-3 grid md:grid-cols-2 gap-3">
        <figure class="tile p-4">${img(sys.hero, 'w-full aspect-[4/3] object-contain mix-blend-multiply')}<figcaption class="label mt-2">booklet figure · assembled</figcaption></figure>
        <figure class="tile p-4">${img(sys.exploded, 'w-full aspect-[4/3] object-contain mix-blend-multiply')}<figcaption class="label mt-2">booklet figure · exploded</figcaption></figure></section>` : ''}`;
    const list = document.getElementById('index');
    if (!sceneKey) return;
    const v = mountViewer(document.getElementById('stage'), { style: 'light' });
    await v.loadScene(sceneKey, S.scenes[sceneKey]);
    v.setExplode(1); v.frame({ distance: sceneKey === 'camera-pod' ? 0.6 : 0.72, elevation: sceneKey === 'camera-pod' ? 0.22 : 0.5 });
    hoverTip(v);
    const go = (m) => (location.hash = `#/parts/${m}`);
    callouts(v, document.getElementById('calls'), ids, go);
    v.on('pick', (p) => p.registered && go(p.model));
    v.on('hover', (p) => list.querySelectorAll('[data-m]').forEach((r) => r.classList.toggle('bg-well', r.dataset.m === p?.model)));
    list.addEventListener('mouseover', (e) => v.setFocus(e.target.closest('[data-m]')?.dataset.m ?? null));
    list.addEventListener('mouseleave', () => v.setFocus(null));
    document.getElementById('ex').oninput = (e) => v.setExplode(+e.target.value);
  },

  async parts([id]) {
    if (!id) return partsIndex();
    const m = S.modelById[id];
    if (!m) return (location.hash = '#/parts');
    const inst = S.instances[id];
    const bom = S.bomForModel(m);
    const fig = S.figureFor(id);
    const sys = S.systemBySlug[m.assembly];
    const siblings = S.models.filter((x) => x.assembly === m.assembly && x.id !== id && x.artifactRole === m.artifactRole).slice(0, 8);
    $app.innerHTML = `
      <div class="pt-6 pb-4 label"><a href="#/systems/${m.assembly}">${sys?.name ?? m.assembly}</a> / ${m.id}</div>
      <section class="grid lg:grid-cols-12 gap-3">
        <div class="tile lg:col-span-7 relative h-[68vh] min-h-[440px] overflow-hidden" id="stage">
          <div class="absolute left-5 top-4 z-10 label">3d · ${m.output}</div>
          <div class="absolute right-5 top-4 z-10 label num" id="dims"></div>
          <div class="absolute left-5 bottom-4 z-10 label">drag to orbit · scroll to zoom</div>
        </div>
        <div class="lg:col-span-5 flex flex-col gap-3">
          <div class="tile p-6">
            <div class="flex gap-2 flex-wrap">${statusChip(m.status)}<span class="chip">${m.artifactRole}</span><span class="chip">rev ${m.revision}</span></div>
            <h1 class="mt-6 text-[36px] leading-[1] font-light tracking-tight break-words">${m.id}</h1>
            <p class="mt-4 text-[14px] max-w-[52ch]">${m.description}</p>
            <div class="mt-6">${rows([
              ['installed qty', inst ? `<span class="num">${inst.count}</span> <span class="text-mute">in ${inst.scene === 'camera-pod' ? 'enclosed pod' : 'passive winch'} scene</span>` : '—'],
              ['bom item', bom.map((b) => `<a class="underline decoration-rule" href="#/bom/${b.id}">${b.name}</a>`).join('<br>') || '<span class="text-mute">reference artifact · no bom part</span>'],
              ['source', `<a class="font-mono text-[12px] underline decoration-rule" target="_blank" href="${links.source(m.entrypoint)}">${m.entrypoint}</a>`],
              ['documentation', `<a class="underline decoration-rule" href="#/docs/${m.documentation}">${m.documentation}</a>`],
            ])}</div>
            <div class="mt-6 grid gap-2">
              <a class="btn" href="${S.download(m.id).url}">download ${m.output.split('.').pop()} <span class="num opacity-60">${m.output}</span></a>
              <a class="btn-ghost" target="_blank" href="${links.raw(m.entrypoint)}">openscad source <span>↓</span></a>
            </div>
          </div>
          ${fig ? `<figure class="tile p-4 flex-1 grid place-items-center">${img(fig, 'max-h-[240px] mix-blend-multiply')}<figcaption class="label self-end w-full">line art · booklet figure</figcaption></figure>` : ''}
        </div>
      </section>
      ${siblings.length ? `<section class="mt-12"><div class="label border-b border-ink pb-2 text-ink">same assembly</div>
        <div class="mt-3 grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3">${siblings.map(partCard).join('')}</div></section>` : ''}`;
    const v = mountViewer(document.getElementById('stage'), { style: 'light', autoRotate: true });
    const size = await v.loadModel(S, id);
    document.getElementById('dims').textContent = size ? `${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} mm` : '';
    if (!size) document.getElementById('stage').insertAdjacentHTML('beforeend', `<div class="absolute inset-0 grid place-items-center label">no compiled mesh in current packs · available from cad release</div>`);
  },

  bom([id]) {
    const sum = S.site.bom.summary;
    if (id) return bomItem(S.bomById[id]);
    const parts = [...S.site.bom.parts].sort((a, b) => (a.usedIn[0]?.assemblyId ?? 'z').localeCompare(b.usedIn[0]?.assemblyId ?? 'z'));
    $app.innerHTML = `
      <div class="pt-10 grid lg:grid-cols-12 gap-3 items-end">
        <div class="lg:col-span-7"><div class="label">${sum.scenarioName}</div><h1 class="text-[48px] font-light tracking-tight leading-none mt-2">Bill of materials</h1></div>
        <div class="lg:col-span-5 grid grid-cols-3 gap-3">
          ${[[fmt.eur(sum.knownGoodsSubtotal), 'known goods'], [fmt.eur(sum.knownShippingSubtotal), 'known shipping'], [sum.warningCount, 'open warnings']].map(([n, l]) => `<div class="tile p-4"><div class="num text-[20px]">${n}</div><div class="label mt-1">${l}</div></div>`).join('')}
        </div>
      </div>
      <div class="tile mt-3 p-4 flex flex-wrap gap-x-6 gap-y-1 label"><span class="text-ink">● status: incomplete</span><span>complete landed total unavailable</span><span>quote ${sum.quoteSnapshotId}</span><span class="truncate">digest ${sum.inputDigest.slice(0, 22)}…</span></div>
      <div class="mt-3 tile p-5">${goodsBar(true)}</div>
      <div class="mt-3 tile overflow-x-auto">
        <table class="w-full text-[12.5px]">
          <thead><tr class="label text-left"><th class="p-3 font-normal">item</th><th class="font-normal">owner</th><th class="font-normal text-right">qty</th><th class="font-normal">supplier</th><th class="font-normal">qualification</th><th class="font-normal text-right pr-4">known goods</th></tr></thead>
          <tbody>${parts.map((p) => `<tr class="border-t border-rule hover:bg-well/60 cursor-pointer" onclick="location.hash='#/bom/${p.id}'">
            <td class="p-3"><div>${p.name}</div><div class="label normal-case tracking-normal">${p.id}</div></td>
            <td class="label">${p.usedIn.map((u) => u.assemblyId).join(', ') || (p.lifecycle === 'planned' ? 'optional' : '—')}</td>
            <td class="num text-right">${p.required ?? '—'} <span class="text-mute">${p.unit === 'each' ? '' : p.unit}</span></td>
            <td class="label">${p.supplierId ?? '—'}</td>
            <td>${p.qualification ? `<span class="chip">${fmt.status(p.qualification)}</span>` : '<span class="label">no offer</span>'}</td>
            <td class="num text-right pr-4">${p.bundle ? '<span class="label">bundle</span>' : p.knownGoods ? fmt.eur(p.knownGoods) : '<span class="text-mute">unknown</span>'}</td></tr>`).join('')}</tbody>
        </table>
      </div>`;
  },

  async docs(path) {
    const p = path.join('/');
    if (!p) {
      const groups = Object.groupBy(S.site.docs, (d) => d.section);
      $app.innerHTML = `<h1 class="pt-10 pb-6 text-[48px] font-light tracking-tight">Documents</h1>
        <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-3">${Object.entries(groups).map(([g, docs]) => `<div class="tile p-5"><div class="flex justify-between label border-b border-ink pb-2"><span class="text-ink">${g}</span><span>${docs.length}</span></div>
        ${docs.map((d) => `<a href="#/docs/${d.path}" class="block py-2 border-b border-rule"><div>${d.title}</div><div class="text-mute text-[11.5px] line-clamp-2">${d.summary}</div></a>`).join('')}</div>`).join('')}</div>`;
      return;
    }
    $app.innerHTML = `<div class="pt-6 grid lg:grid-cols-12 gap-6"><aside class="lg:col-span-3 label lg:sticky lg:top-16 self-start pt-2"><a href="#/docs">documents</a> / ${p.split('/').slice(1, -1).join(' / ')}
      <div class="mt-4 grid gap-2 normal-case tracking-normal text-[12px] text-ink"><a href="${links.source(p)}" target="_blank" class="btn-ghost">view on github <span>↗</span></a><a href="${links.raw(p)}" class="btn-ghost">download .md <span>↓</span></a></div></aside>
      <article class="lg:col-span-9 tile p-6 md:p-10 prose-doc" id="doc"><span class="label">loading…</span></article></div>`;
    document.getElementById('doc').innerHTML = await renderDoc(p);
  },

  downloads() {
    const d = S.site.snapshots;
    const fab = S.models.filter((m) => m.artifactRole === 'fabrication');
    const ref = S.models.filter((m) => m.artifactRole === 'reference');
    $app.innerHTML = `
      <h1 class="pt-10 pb-2 text-[48px] font-light tracking-tight">Downloads</h1>
      <p class="text-mute max-w-[70ch] pb-6">Booklets and packs are committed snapshots. STL/CSG files come from the commit-versioned CAD release built by CI from the OpenSCAD sources.</p>
      <div class="grid md:grid-cols-3 gap-3">
        ${d.map((f) => `<a href="${f.url}" class="tile p-5 flex flex-col gap-6 hover:opacity-100 hover:bg-well">
          <div class="flex justify-between"><span class="chip">${f.kind}</span><span class="label">${f.name.split('.').pop()}</span></div>
          <div class="mt-auto"><div class="font-medium break-words">${f.name}</div><div class="label mt-1 normal-case tracking-normal">${f.path.split('/').slice(0, -1).join('/')}</div></div>
          <div class="flex justify-between items-end"><span class="num text-[22px]">${fmt.bytes(f.bytes)}</span><span class="text-[18px]">↓</span></div></a>`).join('')}
        <a href="${links.releases}" target="_blank" class="tile p-5 flex flex-col gap-6 bg-ink text-tile hover:opacity-90"><span class="chip border-tile/30">release</span>
          <div class="mt-auto font-medium">Latest CAD release</div><div class="label text-tile/60">all ${S.models.length} models · checksums · source zip</div><span class="text-[18px]">↗</span></a>
      </div>
      ${[['fabrication meshes', fab], ['reference assemblies', ref]].map(([t, list]) => `
      <div class="mt-12 flex justify-between label border-b border-ink pb-2"><span class="text-ink">${t}</span><span>${list.length}</span></div>
      <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-x-6">${list.map((m) => `<div class="flex items-center gap-3 py-2 border-b border-rule">
        <a href="#/parts/${m.id}" class="flex-1 min-w-0 truncate">${m.id}</a><span class="label">r${m.revision}</span>
        <a class="chip hover:bg-ink hover:text-tile" href="${S.download(m.id).url}">${m.output.split('.').pop()}</a><a class="chip hover:bg-ink hover:text-tile" target="_blank" href="${links.raw(m.entrypoint)}">scad</a></div>`).join('')}</div>`).join('')}`;
  },
};

function systemTile(s, large = false) {
  const i = S.systems.indexOf(s) + 1;
  return `<a href="#/systems/${s.slug}" class="tile p-3 flex flex-col ${large ? 'min-h-[300px]' : 'min-h-[220px]'} hover:opacity-100 hover:bg-well group">
    <div class="flex justify-between label"><span>${fmt.pad(i)}</span><span>${s.models.length ? s.models.length + ' cad' : ''}</span></div>
    <div class="flex-1 grid place-items-center py-3">${s.hero ? img(s.hero, 'max-h-[140px] mix-blend-multiply group-hover:scale-105 transition-transform') : `<div class="size-16 rounded-full border border-dashed border-rule"></div>`}</div>
    <div class="font-medium">${s.name}</div><div class="label mt-0.5">${s.usages.length} bom lines · ${s.goods ? fmt.eur(s.goods) : '—'}</div></a>`;
}

function partCard(m) {
  const fig = S.figureFor(m.id);
  return `<a href="#/parts/${m.id}" class="tile p-3 flex flex-col min-h-[180px] hover:opacity-100 hover:bg-well">
    <div class="label">r${m.revision}</div>
    <div class="flex-1 grid place-items-center py-2">${fig ? img(fig, 'max-h-[90px] mix-blend-multiply') : '<div class="size-10 rounded-full border border-dashed border-rule"></div>'}</div>
    <div class="text-[12px] leading-tight break-words">${m.id}</div></a>`;
}

function partsIndex() {
  const groups = Object.groupBy(S.models, (m) => m.assembly);
  $app.innerHTML = `<h1 class="pt-10 pb-6 text-[48px] font-light tracking-tight">Parts</h1>` + Object.entries(groups).map(([g, list]) =>
    `<section class="mb-10"><div class="flex justify-between label border-b border-ink pb-2"><span class="text-ink">${S.systemBySlug[g]?.name ?? g}</span><span>${list.length}</span></div>
    <div class="mt-3 grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3">${list.map(partCard).join('')}</div></section>`).join('');
}

function indexRow(id, n) {
  const m = S.modelById[id];
  const q = S.instances[id]?.count;
  return `<li data-m="${id}" class="rounded-lg"><a href="#/parts/${id}" class="grid grid-cols-[28px_1fr_auto] gap-2 items-center py-2 px-1 border-b border-rule">
    <span class="num text-[11px] text-mute">${n ? fmt.pad(n) : '—'}</span><span class="truncate">${id}</span><span class="label">${q ? '×' + q : ''} r${m?.revision ?? ''}</span></a></li>`;
}

function goodsBar(legend = false) {
  const sum = S.site.bom.summary;
  const items = [...sum.assemblyKnownGoods.map((g) => [g.assemblyId, +g.amount]), ['shared bundles', +sum.sharedBundleGoods], ['shipping', +sum.knownShippingSubtotal]].filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const total = items.reduce((s, [, v]) => s + v, 0);
  const shades = ['#121212', '#3a3a39', '#5d5c5a', '#7d7c78', '#9b9a96', '#b6b5b0', '#cbcac5', '#dad9d4', '#e4e3df'];
  return `<div class="mt-5 flex h-2.5 rounded-full overflow-hidden gap-px">${items.map(([k, v], i) => `<div title="${k} ${fmt.eur(v)}" style="width:${(v / total) * 100}%;background:${shades[i]}"></div>`).join('')}</div>
    ${legend ? `<div class="mt-4 grid grid-cols-2 md:grid-cols-5 gap-3">${items.map(([k, v], i) => `<div class="flex gap-2 items-start"><span class="mt-1 size-2 rounded-full shrink-0" style="background:${shades[i]}"></span><div><div class="label">${k}</div><div class="num">${fmt.eur(v)}</div></div></div>`).join('')}</div>` : ''}`;
}

function bomItem(p) {
  if (!p) return (location.hash = '#/bom');
  const fab = S.modelsForBomPart(p.id);
  $app.innerHTML = `
    <div class="pt-6 pb-4 label"><a href="#/bom">bom</a> / ${p.id}</div>
    <section class="grid lg:grid-cols-12 gap-3">
      <div class="lg:col-span-7 tile p-6">
        <div class="flex gap-2 flex-wrap"><span class="chip">${p.kind}</span><span class="chip">${p.lifecycle}</span>${p.traits.map((t) => `<span class="chip">${t}</span>`).join('')}</div>
        <h1 class="mt-6 text-[36px] leading-[1.05] font-light tracking-tight">${p.name}</h1>
        <ul class="mt-6 grid gap-3">${p.requirements.map((r) => `<li class="grid grid-cols-[20px_1fr] gap-2"><span class="label">—</span><span>${r}</span></li>`).join('')}</ul>
      </div>
      <div class="lg:col-span-5 tile p-6">
        <div class="num text-[44px] leading-none">${p.required ?? '—'}<span class="text-[16px] text-mute ml-2">${p.unit}</span></div>
        <div class="label mt-2">required in arbi v1</div>
        <div class="mt-6">${rows([
          ['used in', p.usedIn.map((u) => `${u.assemblyId} <span class="num text-mute">×${u.quantity}</span>`).join('<br>')],
          ['offer', p.offerId], ['supplier', p.supplierId], ['qualification', fmt.status(p.qualification)],
          ['purchase units', p.purchaseUnits], ['known goods', p.bundle ? 'shared bundle' : fmt.eur(p.knownGoods)],
          ['listing', p.offerUrl ? `<a class="underline" target="_blank" href="${p.offerUrl}">supplier page ↗</a>` : null],
        ])}</div>
        ${p.warnings.length ? `<div class="mt-6 label text-ink">evidence gaps</div><ul class="mt-2 text-[12px] text-mute grid gap-1">${p.warnings.map((w) => `<li>· ${w}</li>`).join('')}</ul>` : ''}
      </div>
    </section>
    ${fab.length ? `<section class="mt-12"><div class="flex justify-between label border-b border-ink pb-2"><span class="text-ink">fabrication sources</span><span>${fab.length}</span></div>
      <div class="mt-3 grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3">${fab.map(partCard).join('')}</div></section>` : ''}`;
}

router(views, async (view, args) => {
  viewers.forEach((v) => v.dispose()); viewers = [];
  tip.classList.add('hidden');
  const key = location.hash.split('/')[1] ?? '';
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('underline', a.getAttribute('href') === '#/' + key));
  await (view ?? views[''])(args);
});
</script>
</body>
</html>
