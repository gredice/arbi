name: Documentation improvement
description: Correct or clarify repository documentation without changing the design baseline.
title: "[Docs] "
body:
  - type: input
    id: location
    attributes:
      label: Document or section
      description: Link the affected file or heading.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Identify incorrect, missing, ambiguous, duplicated, or stale information.
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Suggested correction and evidence
      description: Include the authoritative repository source, calculation, standard, measurement, or provenance record.
    validations:
      required: true

  - type: checkboxes
    id: baseline
    attributes:
      label: Scope confirmation
      options:
        - label: This does not silently change a physical, software, safety, interface, or V1 baseline decision.
          required: true
