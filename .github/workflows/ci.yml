# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect CAD and booklet changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cad: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.cad == 'true' }}
      booklets: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.booklets == 'true' }}
    steps:
      # PR files come from the read-only API; pushes compare the full pushed range.
      - uses: actions/checkout@v6.0.3
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            cad:
              - 'hardware/**/*.scad'
              - 'hardware/models.json'
              - 'hardware/models.schema.json'
              - deleted: 'hardware/assemblies/**/README.md'
              - 'bom/catalog/parts.json'
              - 'scripts/check-cad.mjs'
              - 'scripts/cad-previews/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cad-release.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
            booklets:
              - 'hardware/**/*.scad'
              - 'hardware/models.json'
              - 'scripts/winch-booklet/**'
              - 'scripts/payload-booklet/**'
              - 'scripts/check-booklet.py'
              - 'scripts/check-winch-cover-meshes.py'
              - 'scripts/check-winch-pole-meshes.py'
              - 'docs/project/industrial-design.md'
              - '.github/workflows/booklets.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cad-release.yml'

  workspace:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.8
        name: Install pnpm

      - uses: actions/setup-node@v6.4.0
        name: Set up Node.js
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree -w /dev/null)" HEAD -- .

      - name: Check Markdown links
        run: pnpm docs:check

      - name: Check architecture recovery experiment
        run: node --test scripts/spikes/software-recovery.test.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # setup-node installs outside /usr/bin. The declared Linux unit requires
      # an explicitly staged pinned runtime at this path before verification.
      - name: Stage Node for Linux service verification
        run: |
          ARBI_TEST_NODE="$(command -v node)"
          if [ "$ARBI_TEST_NODE" != /usr/bin/node ]; then
            sudo ln -sf "$ARBI_TEST_NODE" /usr/bin/node
          fi

      - name: Test
        # Each suite already launches host consumers, databases or TLS peers.
        # Avoid competing package suites starving bounded loopback requests.
        run: pnpm test --concurrency=1

      - name: Compare native Linux interface counters with interrupted and repeated TCP transfers
        run: pnpm --filter @arbi/traffic test:linux

      - name: Check enrollment transactions on isolated PostgreSQL
        run: pnpm --filter @arbi/dashboard test:postgres

      - name: Check cross-runtime reference fixtures
        run: pnpm protocol:check

      - name: Check independent offline scenario consumers
        run: pnpm scenario:check

      - name: Build
        run: pnpm build

      - name: Install dashboard browser
        run: pnpm --filter @arbi/dashboard exec playwright install --with-deps chromium

      - name: Check dashboard browser and protected synthetic PostgreSQL flow
        run: pnpm --filter @arbi/dashboard test:browser

      - name: Check built enrollment HTTP boundary
        run: pnpm --filter @arbi/dashboard test:http

  bom:
    name: Validate generated BOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.8
        name: Install pnpm

      - uses: actions/setup-node@v6.4.0
        name: Set up Node.js
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate BOM inputs and tracked reports
        run: pnpm bom:check

      - name: Regenerate BOM reports
        run: pnpm bom:generate

      - name: Verify generated BOM is clean
        run: git diff --exit-code -- bom/generated

  cad:
    name: Validate OpenSCAD models
    needs: changes
    if: needs.changes.outputs.cad == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.8
        name: Install pnpm

      - uses: actions/setup-node@v6.4.0
        name: Set up Node.js
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad=2021.01-6build4 libegl1 libgl1-mesa-dri xvfb xauth

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/cad-previews/requirements.txt

      - name: Install CAD preview renderer
        run: python -m pip install -r scripts/cad-previews/requirements.txt

      - name: Validate and compile registered models
        env:
          CAD_OUTPUT: ${{ runner.temp }}/cad-models
        run: pnpm cad:check -- --require-openscad --output-dir "$CAD_OUTPUT"

      - name: Generate and verify every registered model figure
        env:
          CAD_OUTPUT: ${{ runner.temp }}/cad-models
          PREVIEW_OUTPUT: ${{ runner.temp }}/cad-previews
        run: python scripts/cad-previews/build.py --cad-dir "$CAD_OUTPUT" --output "$PREVIEW_OUTPUT"

      - name: Verify complete figure coverage through the site compiler
        env:
          ARBI_OFFLINE: '1'
          ARBI_CAD_PREVIEW_PACK: ${{ runner.temp }}/cad-previews/ARBI-CAD-previews.zip
          ARBI_DATA_DIR: ${{ runner.temp }}/preview-site-data
        run: |
          pnpm --filter @arbi/docs data
          # JavaScript template interpolation is intentionally literal to the shell.
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const site = JSON.parse(readFileSync(`${process.env.ARBI_DATA_DIR}/site.json`));
            assert.deepEqual(Object.keys(site.figures).sort(), site.registry.models.map(m => m.id).sort());
          '

      - name: Upload CAD figures for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cad-previews-${{ github.sha }}
          path: ${{ runner.temp }}/cad-previews/ARBI-CAD-previews.zip
          if-no-files-found: error
          retention-days: 14

  booklets:
    name: Validate assembly booklets
    needs: changes
    if: needs.changes.outputs.booklets == 'true'
    uses: ./.github/workflows/booklets.yml

  ci_ok:
    name: "[CI] OK"
    if: ${{ always() }}
    needs:
      - changes
      - workspace
      - bom
      - cad
      - booklets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        if: >-
          ${{ needs.changes.result != 'success' ||
              needs.workspace.result != 'success' ||
              needs.bom.result != 'success' ||
              !(needs.cad.result == 'success' ||
                (needs.changes.outputs.cad == 'false' && needs.cad.result == 'skipped')) ||
              !(needs.booklets.result == 'success' ||
                (needs.changes.outputs.booklets == 'false' && needs.booklets.result == 'skipped')) }}
        run: exit 1

      - name: Confirm required jobs passed
        run: echo "All required CI jobs passed."
