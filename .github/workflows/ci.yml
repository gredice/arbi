# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect CAD changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cad: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.cad == 'true' }}
    steps:
      # PR files come from the read-only API; pushes compare the full pushed range.
      - uses: actions/checkout@v6.0.3
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            cad:
              - 'hardware/**/*.scad'
              - 'hardware/models.json'
              - 'hardware/models.schema.json'
              - deleted: 'hardware/assemblies/**/README.md'
              - 'bom/catalog/parts.json'
              - 'scripts/check-cad.mjs'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cad-release.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'

  workspace:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.8
        name: Install pnpm

      - uses: actions/setup-node@v6.4.0
        name: Set up Node.js
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree -w /dev/null)" HEAD -- .

      - name: Check Markdown links
        run: pnpm docs:check

      - name: Check architecture recovery experiment
        run: node --test scripts/spikes/software-recovery.test.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check enrollment transactions on isolated PostgreSQL
        run: pnpm --filter @arbi/dashboard test:postgres

      - name: Check cross-runtime reference fixtures
        run: pnpm protocol:check

      - name: Build
        run: pnpm build

  bom:
    name: Validate generated BOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.8
        name: Install pnpm

      - uses: actions/setup-node@v6.4.0
        name: Set up Node.js
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate BOM inputs and tracked reports
        run: pnpm bom:check

      - name: Regenerate BOM reports
        run: pnpm bom:generate

      - name: Verify generated BOM is clean
        run: git diff --exit-code -- bom/generated

  cad:
    name: Validate OpenSCAD models
    needs: changes
    if: needs.changes.outputs.cad == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.8
        name: Install pnpm

      - uses: actions/setup-node@v6.4.0
        name: Set up Node.js
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad=2021.01-6build4

      - name: Validate and compile registered models
        run: pnpm cad:check -- --require-openscad

  ci_ok:
    name: "[CI] OK"
    if: ${{ always() }}
    needs:
      - changes
      - workspace
      - bom
      - cad
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        if: >-
          ${{ needs.changes.result != 'success' ||
              needs.workspace.result != 'success' ||
              needs.bom.result != 'success' ||
              !(needs.cad.result == 'success' ||
                (needs.changes.outputs.cad == 'false' && needs.cad.result == 'skipped')) }}
        run: exit 1

      - name: Confirm required jobs passed
        run: echo "All required CI jobs passed."
