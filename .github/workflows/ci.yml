# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional MAJOR.MINOR.PATCH bump (otherwise increment the latest patch)'
        type: string
        required: false

# Superseded PR runs can stop. Main runs remain independent so a content-only
# merge cannot cancel a model release or hide an earlier push's changed inputs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: Plan affected work
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workspace: ${{ steps.plan.outputs.workspace }}
      workspace_matrix: ${{ steps.plan.outputs.workspace_matrix }}
      bom: ${{ steps.plan.outputs.bom }}
      cad: ${{ steps.plan.outputs.cad }}
      previews: ${{ steps.plan.outputs.previews }}
      booklets: ${{ steps.plan.outputs.booklets }}
      booklet_matrix: ${{ steps.plan.outputs.booklet_matrix }}
      recovery: ${{ steps.plan.outputs.recovery }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
      - name: Test change selection and required-result gate
        run: node --test scripts/ci/*.test.mjs
      - name: Select work from the full change range and dependency graph
        id: plan
        run: node scripts/ci/plan.mjs

  repository:
    name: Check repository links and whitespace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
      # Any removed/moved file can break a Markdown target, including source files.
      - name: Check Markdown links
        run: node scripts/check-docs.mjs
      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree -w /dev/null)" HEAD -- .

  workspace:
    name: Validate ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.workspace_matrix) }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          filter: ${{ matrix.name }}...
          extra-filter: ${{ matrix.name == '@arbi/dashboard' && '@arbi/edge-controller...' || '' }}
          # Separate stores prevent a fast library job from saving only its
          # small closure under the same key needed by either Next.js app.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            ${{ matrix.path }}/package.json
      - name: Restore compilation and Next.js caches
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            .turbo/cache
            ${{ matrix.path }}/.next/cache
          key: ci-v1-${{ runner.os }}-${{ runner.arch }}-node24.15.0-${{ matrix.name }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ci-v1-${{ runner.os }}-${{ runner.arch }}-node24.15.0-${{ matrix.name }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            ci-v1-${{ runner.os }}-${{ runner.arch }}-node24.15.0-${{ matrix.name }}-
      - name: Build, lint and typecheck the selected workspace
        env:
          WORKSPACE: ${{ matrix.name }}
          # Deterministic offline site inputs keep PR builds independent of Latest.
          ARBI_OFFLINE: '1'
        # pnpm lifecycle scripts supply the launcher metadata Turbo needs with
        # pnpm 11's native executable; bare `pnpm exec turbo` does not.
        run: |
          pnpm build --filter "$WORKSPACE" --concurrency=1
          pnpm lint --filter "$WORKSPACE" --concurrency=1
          pnpm typecheck --filter "$WORKSPACE" --concurrency=1
      - name: Build independent edge consumer for dashboard native recovery tests
        if: matrix.name == '@arbi/dashboard'
        run: pnpm build --filter @arbi/edge-controller --concurrency=1
      - name: Stage pinned Node for edge Linux service verification
        if: matrix.name == '@arbi/edge-controller'
        run: |
          ARBI_TEST_NODE="$(command -v node)"
          if [ "$ARBI_TEST_NODE" != /usr/bin/node ]; then
            sudo ln -sf "$ARBI_TEST_NODE" /usr/bin/node
          fi
      - name: Test selected workspace with fresh host evidence
        env:
          WORKSPACE: ${{ matrix.name }}
        # Parallelism is between runners; bounded loopback suites stay serial.
        run: pnpm test --filter "$WORKSPACE" --concurrency=1
      # Protocol/scenario package tests already run their independent host
      # conformance consumers. Fresh tests avoid repeating those suites here.
      - name: Compare native Linux counters with interrupted and repeated TCP transfers
        if: matrix.name == '@arbi/traffic'
        run: pnpm --filter @arbi/traffic test:linux
      - name: Check dashboard transactions on isolated PostgreSQL
        if: matrix.name == '@arbi/dashboard'
        run: pnpm --filter @arbi/dashboard test:postgres
      - name: Restore dashboard browser
        if: matrix.name == '@arbi/dashboard'
        id: browser
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/arbi-dashboard/package.json', 'pnpm-lock.yaml') }}
      - name: Install dashboard browser system dependencies
        if: matrix.name == '@arbi/dashboard'
        run: pnpm --filter @arbi/dashboard exec playwright install-deps chromium
      - name: Install dashboard browser on cache miss
        if: matrix.name == '@arbi/dashboard' && steps.browser.outputs.cache-hit != 'true'
        run: pnpm --filter @arbi/dashboard exec playwright install chromium
      - name: Check dashboard browser and protected synthetic PostgreSQL flow
        if: matrix.name == '@arbi/dashboard'
        run: pnpm --filter @arbi/dashboard test:browser
      - name: Check built dashboard HTTP boundary
        if: matrix.name == '@arbi/dashboard'
        run: pnpm --filter @arbi/dashboard test:http

  recovery:
    name: Check architecture recovery experiment
    needs: changes
    if: needs.changes.outputs.recovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
      - run: node --test scripts/spikes/software-recovery.test.mjs

  bom:
    name: Validate generated BOM
    needs: changes
    if: needs.changes.outputs.bom == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          filter: '@arbi/bom...'
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            packages/arbi-bom/package.json
      - name: Validate BOM inputs and tracked reports
        run: pnpm bom:check
      - name: Regenerate BOM reports
        run: pnpm bom:generate
      - name: Verify generated BOM is clean
        run: git diff --exit-code -- bom/generated

  cad:
    name: Validate and export OpenSCAD models
    needs: changes
    if: needs.changes.outputs.cad == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          filter: '@arbi/monorepo'
      - name: Install pinned OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad=2021.01-6build4
      - name: Test bounded CAD workers and failure handling
        run: node --test scripts/check-cad.test.mjs
      - name: Validate and compile every registered model once
        env:
          CAD_OUTPUT: ${{ runner.temp }}/cad
        run: pnpm cad:check -- --require-openscad --jobs 4 --output-dir "$CAD_OUTPUT"
      - name: Upload commit-matched geometry for review and release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cad-${{ github.sha }}
          path: ${{ runner.temp }}/cad/*
          if-no-files-found: error
          retention-days: 14

  previews:
    name: Validate registered CAD previews
    needs: [changes, cad]
    if: needs.changes.outputs.previews == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          filter: '@arbi/docs...'
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            apps/arbi-docs/package.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/cad-previews/requirements.txt
      - name: Install pinned OpenSCAD and preview rendering backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad=2021.01-6build4 libegl1 libgl1-mesa-dri xvfb xauth
      - name: Install CAD preview renderer
        run: python -m pip install -r scripts/cad-previews/requirements.txt
      - name: Check reference decomposition and bounded mesh workers
        run: python -m unittest discover -s scripts/cad-previews -p 'test_*.py'
      - name: Download this run's validated geometry
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cad-${{ github.sha }}
          path: ${{ runner.temp }}/cad-models
      - name: Generate and verify every registered model figure
        env:
          CAD_OUTPUT: ${{ runner.temp }}/cad-models
          PREVIEW_OUTPUT: ${{ runner.temp }}/cad-previews
        run: python scripts/cad-previews/build.py --jobs 4 --cad-dir "$CAD_OUTPUT" --output "$PREVIEW_OUTPUT"
      - name: Verify complete figure coverage through the site compiler
        env:
          ARBI_OFFLINE: '1'
          ARBI_CAD_PREVIEW_PACK: ${{ runner.temp }}/cad-previews/ARBI-CAD-previews.zip
          ARBI_DATA_DIR: ${{ runner.temp }}/preview-site-data
        run: |
          pnpm --filter @arbi/docs data
          # JavaScript template interpolation is intentionally literal to the shell.
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const site = JSON.parse(readFileSync(`${process.env.ARBI_DATA_DIR}/site.json`));
            assert.deepEqual(Object.keys(site.figures).sort(), site.registry.models.map(m => m.id).sort());
          '
      - name: Upload CAD figures for review and release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cad-previews-${{ github.sha }}
          path: ${{ runner.temp }}/cad-previews/ARBI-CAD-previews.zip
          if-no-files-found: error
          retention-days: 14

  booklets:
    name: Build ${{ matrix.variant }} booklet
    needs: changes
    if: needs.changes.outputs.booklets == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.booklet_matrix) }}
    env:
      QT_QPA_PLATFORM: offscreen
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/winch-booklet/requirements.txt
      - name: Install pinned OpenSCAD and headless rendering backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad=2021.01-6build4 libegl1 libgl1-mesa-dri
      - name: Install booklet dependencies
        run: python -m pip install -r scripts/winch-booklet/requirements.txt
      - name: Build current meshes, geometry checks, illustrations and PDF/ZIP
        env:
          BUILD_SCRIPT: ${{ matrix.script }}
          VARIANT: ${{ matrix.variant }}
          BOOKLET_OUTPUT: ${{ runner.temp }}/booklet
        run: |
          options=()
          if [[ "$VARIANT" == enclosure ]]; then options+=(--enclosure); fi
          python "$BUILD_SCRIPT" "${options[@]}" --output "$BOOKLET_OUTPUT"
      - name: Validate booklet and paired source pack
        env:
          VARIANT: ${{ matrix.variant }}
          BOOKLET_OUTPUT: ${{ runner.temp }}/booklet
        run: python scripts/check-booklet.py "$BOOKLET_OUTPUT" --variant "$VARIANT"
      - name: Confirm build did not change tracked files
        run: git diff --exit-code
      - name: Upload commit-matched PDF and source pack
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: booklets-${{ matrix.variant }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/booklet/${{ matrix.artifact }}-assembly-STL.pdf
            ${{ runner.temp }}/booklet/${{ matrix.artifact }}-STL-pack.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  ci_ok:
    name: "[CI] OK"
    if: ${{ always() }}
    needs: [changes, repository, workspace, recovery, bom, cad, previews, booklets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
      - name: Fail unless selected work succeeded and every skip was intentional
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/check-results.mjs

  publish:
    name: Publish CAD and booklet snapshot
    needs: [changes, ci_ok, cad, previews, booklets]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' && needs.ci_ok.result == 'success' &&
          needs.cad.result == 'success' && needs.previews.result == 'success' &&
          needs.booklets.result == 'success' &&
          needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: cad-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
      - name: Download geometry already validated in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cad-${{ github.sha }}
          path: ${{ runner.temp }}/cad-release
      - name: Download booklets already validated in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: booklets-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/cad-release
      - name: Download CAD previews already validated in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cad-previews-${{ github.sha }}
          path: ${{ runner.temp }}/cad-release
      - name: Package commit-matched hardware sources
        env:
          CAD_OUTPUT: ${{ runner.temp }}/cad-release
        run: |
          for artifact in ARBI-winch ARBI-camera-pod-bench ARBI-camera-pod-enclosure ARBI-corner-support; do
            test -s "$CAD_OUTPUT/$artifact-assembly-STL.pdf"
            test -s "$CAD_OUTPUT/$artifact-STL-pack.zip"
          done
          test -s "$CAD_OUTPUT/ARBI-CAD-previews.zip"
          git archive --format=zip --output="$CAD_OUTPUT/cad-sources-${GITHUB_SHA}.zip" HEAD hardware

      - name: Publish versioned release with source provenance
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CAD_OUTPUT: ${{ runner.temp }}/cad-release
          CAD_VERSION: ${{ inputs.version }}
        run: node scripts/publish-cad-release.mjs

      # A rerun repairs a failed refresh even when the immutable release exists.
      - name: Refresh the public site
        if: steps.publish.outputs.latest == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.ARBI_SITE_DEPLOY_HOOK }}
        run: |
          if [[ -z "$DEPLOY_HOOK" ]]; then
            echo "::error::ARBI_SITE_DEPLOY_HOOK is required to refresh the production CAD data."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --request POST "$DEPLOY_HOOK" > /dev/null
          echo "Requested a production rebuild of arbi.gredice.com."

      - name: Verify the public site picked up this release
        if: steps.publish.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CAD_RELEASE_TAG: ${{ steps.publish.outputs.tag }}
          CAD_RELEASE_COMMIT: ${{ steps.publish.outputs.commit }}
        run: node scripts/check-site-release.mjs
