# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build assembly booklets

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.variant }} booklet
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: winch
            script: scripts/winch-booklet/build.py
            artifact: ARBI-winch
          - variant: bench
            script: scripts/payload-booklet/build.py
            artifact: ARBI-payload
          - variant: enclosure
            script: scripts/payload-booklet/build.py
            artifact: ARBI-payload-enclosure
    env:
      QT_QPA_PLATFORM: offscreen
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/winch-booklet/requirements.txt

      - name: Install pinned OpenSCAD and headless rendering backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad=2021.01-6build4 libegl1 libgl1-mesa-dri

      - name: Install booklet dependencies
        run: python -m pip install -r scripts/winch-booklet/requirements.txt

      - name: Build current meshes, geometry checks, illustrations and PDF/ZIP
        env:
          BUILD_SCRIPT: ${{ matrix.script }}
          VARIANT: ${{ matrix.variant }}
          BOOKLET_OUTPUT: ${{ runner.temp }}/booklet
        run: |
          options=()
          if [[ "$VARIANT" == enclosure ]]; then options+=(--enclosure); fi
          python "$BUILD_SCRIPT" "${options[@]}" --output "$BOOKLET_OUTPUT"

      - name: Validate booklet and paired source pack
        env:
          VARIANT: ${{ matrix.variant }}
          BOOKLET_OUTPUT: ${{ runner.temp }}/booklet
        run: python scripts/check-booklet.py "$BOOKLET_OUTPUT" --variant "$VARIANT"

      - name: Confirm build did not change tracked files
        run: git diff --exit-code

      - name: Upload commit-matched PDF and source pack
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: booklets-${{ matrix.variant }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/booklet/${{ matrix.artifact }}-assembly-STL.pdf
            ${{ runner.temp }}/booklet/${{ matrix.artifact }}-STL-pack.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
