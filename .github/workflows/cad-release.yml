# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish CAD models and assembly booklets

on:
  push:
    branches:
      - main
    paths:
      - 'hardware/**/*.scad'
      - 'hardware/models.json'
      - 'hardware/models.schema.json'
      - 'scripts/check-cad.mjs'
      - 'scripts/cad-previews/**'
      - 'scripts/winch-booklet/**'
      - 'scripts/payload-booklet/**'
      - 'scripts/check-booklet.py'
      - 'scripts/check-winch-cover-meshes.py'
      - 'docs/project/industrial-design.md'
      - '.github/workflows/booklets.yml'
      - '.github/workflows/cad-release.yml'
  workflow_dispatch:

# Serialize releases so a slower build cannot replace a newer "Latest" release.
concurrency:
  group: cad-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  booklets:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/booklets.yml

  publish:
    name: Build and publish CAD and booklet snapshot
    needs: booklets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.8
        name: Install pnpm

      - uses: actions/setup-node@v6.4.0
        name: Set up Node.js
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad=2021.01-6build4 libegl1 libgl1-mesa-dri xvfb xauth

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/cad-previews/requirements.txt

      - name: Install CAD preview renderer
        run: python -m pip install -r scripts/cad-previews/requirements.txt

      - name: Validate and export every registered model
        env:
          CAD_OUTPUT: ${{ runner.temp }}/cad-release
        run: pnpm cad:check -- --require-openscad --output-dir "$CAD_OUTPUT"

      - name: Generate every registered model figure
        env:
          CAD_OUTPUT: ${{ runner.temp }}/cad-release
        run: python scripts/cad-previews/build.py --cad-dir "$CAD_OUTPUT" --output "$CAD_OUTPUT"

      - name: Download the booklets built from this commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: booklets-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/cad-release

      - name: Package commit-matched sources and checksums
        env:
          CAD_OUTPUT: ${{ runner.temp }}/cad-release
        run: |
          for artifact in ARBI-winch ARBI-payload ARBI-payload-enclosure; do
            test -s "$CAD_OUTPUT/$artifact-assembly-STL.pdf"
            test -s "$CAD_OUTPUT/$artifact-STL-pack.zip"
          done
          git archive --format=zip --output="$CAD_OUTPUT/cad-sources-${GITHUB_SHA}.zip" HEAD hardware
          cd "$CAD_OUTPUT"
          sha256sum -- *.stl *.csg *.pdf *.zip > SHA256SUMS.txt

      - name: Publish commit-versioned release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CAD_OUTPUT: ${{ runner.temp }}/cad-release
        run: |
          tag="cad-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          notes="${RUNNER_TEMP}/cad-release-notes.md"
          # Markdown code spans are literal; shell variables use printf arguments.
          # shellcheck disable=SC2016
          {
            printf 'CAD snapshot for commit [`%s`](https://github.com/%s/commit/%s).\n\n' "${GITHUB_SHA:0:12}" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'All %s registered models were built with OpenSCAD %s. Download individual STL fabrication parts, CSG assembly references, or the ZIP of all tracked hardware sources. `SHA256SUMS.txt` verifies the assets.\n\n' "$(jq '.models | length' hardware/models.json)" "$(jq -r '.openScadVersion' hardware/models.json)"
            printf 'Includes current winch, dry payload bench and integrated payload enclosure assembly PDFs and STL/source packs. Booklet illustrations use white faces with dark visible outlines and feature edges. Each pack includes source hashes, current mesh revisions, assembly transforms and nominal geometry checks.\n\n'
            printf 'The `ARBI-CAD-previews.zip` pack contains one PNG per registered model: line-art fabrication figures and shaded CSG reference previews, with model revisions, transitive source hashes and image checksums.\n\n'
            printf 'Model revisions and evidence status are recorded in `hardware/models.json`. These CAD exports do not by themselves establish printability, fit, strength, or installation safety.\n'
          } > "$notes"

          # Mark this release Latest unless the current Latest belongs to a newer commit.
          # Runs are serialized, but merges land faster than booklet builds, so requiring
          # this commit to still be main's head left Latest on an old snapshot.
          # Only a 404 means there is no Latest release yet; any other lookup error fails
          # the step rather than risk an older build replacing a newer Latest.
          latest=true
          lookup_error="${RUNNER_TEMP}/latest-release.err"
          if current="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>"$lookup_error")"; then
            if [[ "$current" == cad-* ]]; then
              compare_error="${RUNNER_TEMP}/latest-compare.err"
              if relation="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current#cad-}...${GITHUB_SHA}" --jq .status 2>"$compare_error")"; then
                if [[ "$relation" != "ahead" && "$relation" != "identical" ]]; then
                  latest=false
                fi
              elif grep -q 'HTTP 404' "$compare_error"; then
                # The Latest commit is no longer reachable (for example after a force-push);
                # this run's main commit takes over rather than blocking every later release.
                echo "Current Latest ${current} is not comparable; marking this release Latest."
              else
                cat "$compare_error" >&2
                echo "Could not compare with the current Latest release." >&2
                exit 1
              fi
            fi
          elif grep -q 'HTTP 404' "$lookup_error"; then
            echo "No Latest release yet."
          else
            cat "$lookup_error" >&2
            echo "Could not read the current Latest release." >&2
            exit 1
          fi

          gh release create "$tag" "$CAD_OUTPUT"/* \
            --target "$GITHUB_SHA" \
            --title "CAD models ${GITHUB_SHA:0:12}" \
            --notes-file "$notes" \
            --latest="$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # The public site reads the Latest release at build time; rebuild it when that changes.
      # The release is already published, so a failed refresh is reported without failing the run.
      - name: Refresh the public site
        if: steps.publish.outputs.latest == 'true'
        continue-on-error: true
        env:
          DEPLOY_HOOK: ${{ secrets.ARBI_SITE_DEPLOY_HOOK }}
        run: |
          if [[ -z "$DEPLOY_HOOK" ]]; then
            echo "::notice::ARBI_SITE_DEPLOY_HOOK is not set; the site picks up this release on its next deployment."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --request POST "$DEPLOY_HOOK" > /dev/null
          echo "Requested a production rebuild of arbi.gredice.com."
