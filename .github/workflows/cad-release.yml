# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish CAD models and assembly booklets

on:
  push:
    branches:
      - main
    paths:
      - 'hardware/**/*.scad'
      - 'hardware/models.json'
      - 'hardware/models.schema.json'
      - 'scripts/check-cad.mjs'
      - 'scripts/cad-release-data.mjs'
      - 'scripts/publish-cad-release.mjs'
      - 'scripts/check-site-release.mjs'
      - 'scripts/cad-previews/**'
      - 'scripts/winch-booklet/**'
      - 'scripts/payload-booklet/**'
      - 'scripts/check-booklet.py'
      - 'scripts/check-winch-cover-meshes.py'
      - 'scripts/check-winch-pole-meshes.py'
      - 'docs/project/industrial-design.md'
      - '.github/workflows/booklets.yml'
      - '.github/workflows/cad-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional MAJOR.MINOR.PATCH bump (otherwise increment the latest patch)'
        type: string
        required: false

# Serialize releases so a slower build cannot replace a newer "Latest" release.
concurrency:
  group: cad-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  booklets:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/booklets.yml

  publish:
    name: Build and publish CAD and booklet snapshot
    needs: booklets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.8
        name: Install pnpm

      - uses: actions/setup-node@v6.4.0
        name: Set up Node.js
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad=2021.01-6build4 libegl1 libgl1-mesa-dri xvfb xauth

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/cad-previews/requirements.txt

      - name: Install CAD preview renderer
        run: python -m pip install -r scripts/cad-previews/requirements.txt

      - name: Validate and export every registered model
        env:
          CAD_OUTPUT: ${{ runner.temp }}/cad-release
        run: pnpm cad:check -- --require-openscad --output-dir "$CAD_OUTPUT"

      - name: Generate every registered model figure
        env:
          CAD_OUTPUT: ${{ runner.temp }}/cad-release
        run: python scripts/cad-previews/build.py --cad-dir "$CAD_OUTPUT" --output "$CAD_OUTPUT"

      - name: Download the booklets built from this commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: booklets-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/cad-release

      - name: Package commit-matched hardware sources
        env:
          CAD_OUTPUT: ${{ runner.temp }}/cad-release
        run: |
          for artifact in ARBI-winch ARBI-payload ARBI-payload-enclosure; do
            test -s "$CAD_OUTPUT/$artifact-assembly-STL.pdf"
            test -s "$CAD_OUTPUT/$artifact-STL-pack.zip"
          done
          git archive --format=zip --output="$CAD_OUTPUT/cad-sources-${GITHUB_SHA}.zip" HEAD hardware

      - name: Publish versioned release with source provenance
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CAD_OUTPUT: ${{ runner.temp }}/cad-release
          CAD_VERSION: ${{ inputs.version }}
        run: node scripts/publish-cad-release.mjs

      # A rerun repairs a failed refresh even when the immutable release exists.
      - name: Refresh the public site
        if: steps.publish.outputs.latest == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.ARBI_SITE_DEPLOY_HOOK }}
        run: |
          if [[ -z "$DEPLOY_HOOK" ]]; then
            echo "::error::ARBI_SITE_DEPLOY_HOOK is required to refresh the production CAD data."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --request POST "$DEPLOY_HOOK" > /dev/null
          echo "Requested a production rebuild of arbi.gredice.com."

      - name: Verify the public site picked up this release
        if: steps.publish.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CAD_RELEASE_TAG: ${{ steps.publish.outputs.tag }}
          CAD_RELEASE_COMMIT: ${{ steps.publish.outputs.commit }}
        run: node scripts/check-site-release.mjs
