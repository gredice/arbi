name: Set up cached workspace
description: Install the pinned runtime and only the selected workspace dependency closure
inputs:
  filter:
    description: pnpm workspace selector, including dependencies when needed
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.0.8
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: 24.15.0
        cache: pnpm
    - name: Install selected dependencies
      shell: bash
      env:
        WORKSPACE_FILTER: ${{ inputs.filter }}
      run: pnpm --filter "$WORKSPACE_FILTER" install --frozen-lockfile
